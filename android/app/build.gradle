plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

def rootCMakeLists = "../../CMakeLists.txt"
def rootCMakeListsContent = file(rootCMakeLists).text
static def grepVersionComponent(content, varname) {
    def match = content =~ /set\($varname ([0-9]+)\)/
    if(!match.find())
        throw new GradleException("Failed to find $varname in CMakeLists.txt")
    return match.group(1)
}
def chiakiVersionMajor = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_MAJOR")
def chiakiVersionMinor = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_MINOR")
def chiakiVersionPatch = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_PATCH")
def chiakiVersion = "$chiakiVersionMajor.$chiakiVersionMinor.$chiakiVersionPatch"
println("Determined Chiaki Version: $chiakiVersion")

android {
    namespace "com.metallic.chiaki"
    compileSdk 36
    ndkVersion "28.2.13676358"

    def isWindows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("win")
    def localProtoc = rootProject.file(isWindows ? "../.tools/protoc/bin/protoc.exe" : "../.tools/protoc/bin/protoc")
    def cmakeArgs = [
            "-DCHIAKI_ENABLE_TESTS=OFF",
            "-DCHIAKI_ENABLE_CLI=OFF",
            "-DCHIAKI_ENABLE_GUI=OFF",
            "-DCHIAKI_ENABLE_SETSU=OFF",
            "-DCHIAKI_ENABLE_ANDROID=ON",
            "-DCHIAKI_ENABLE_FFMPEG_DECODER=OFF",
            "-DCHIAKI_ENABLE_PI_DECODER=OFF",
            "-DCHIAKI_LIB_ENABLE_OPUS=OFF",
            "-DCHIAKI_LIB_OPENSSL_EXTERNAL_PROJECT=ON",
            "-DCHIAKI_LIB_JSONC_EXTERNAL_PROJECT=ON",
            "-DCHIAKI_LIB_MINIUPNPC_EXTERNAL_PROJECT=ON",
            "-DCHIAKI_ENABLE_STEAM_SHORTCUT=OFF",
            "-DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF",
            "-DANDROID_STL=c++_shared",
            "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
            "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
    ]
    if (localProtoc.exists()) {
        cmakeArgs.add("-DPROTOC=${localProtoc.absolutePath.replace('\\', '/')}")
    }
    def envPython = System.getenv("PYTHON_EXECUTABLE")
    if (envPython && file(envPython).exists()) {
        cmakeArgs.add("-DPYTHON_EXECUTABLE=${file(envPython).absolutePath.replace('\\', '/')}")
    } else if (isWindows) {
        def pathDirs = (System.getenv("PATH") ?: "").split(File.pathSeparator)
        def foundPy = pathDirs.findResult { dir ->
            if (!dir || dir.toLowerCase(Locale.ROOT).contains("windowsapps")) return null
            def f = new File(dir, "python.exe")
            f.exists() ? f : null
        }
        if (foundPy) {
            cmakeArgs.add("-DPYTHON_EXECUTABLE=${foundPy.absolutePath.replace('\\', '/')}")
        }
    }

    defaultConfig {
        applicationId "io.github.denarmo.chiaki"
        minSdk 26
        targetSdk 36
        versionCode 100
        versionName "${chiakiVersion}-ecp1"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments(*cmakeArgs)
            }
        }
    }

    buildFeatures {
        viewBinding true
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += "-opt-in=kotlin.ExperimentalUnsignedTypes"
    }

    externalNativeBuild {
        cmake {
            version "3.31.5"
            path rootCMakeLists
        }
    }

    signingConfigs {
        release
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    Properties properties = new Properties()
    def localPropertiesFile = rootProject.file("local.properties")
    if (localPropertiesFile.exists()) {
        properties.load(localPropertiesFile.newDataInputStream())
    }
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    if (keystorePropertiesFile.exists()) {
        properties.load(keystorePropertiesFile.newDataInputStream())
    }

    if (properties.containsKey("storeFile") && properties.containsKey("storePassword")
            && properties.containsKey("keyAlias") && properties.containsKey("keyPassword")) {
        println("Enabling Release Signing from keystore.properties")
        signingConfigs.release.storeFile = rootProject.file(properties.getProperty("storeFile"))
        signingConfigs.release.storePassword = properties.getProperty("storePassword")
        signingConfigs.release.keyAlias = properties.getProperty("keyAlias")
        signingConfigs.release.keyPassword = properties.getProperty("keyPassword")
        buildTypes.release.signingConfig = signingConfigs.release
    } else if (properties.containsKey("chiakiKeystore")) {
        println("Enabling Local Signing")
        buildTypes.release.signingConfig = signingConfigs.release
        buildTypes.debug.signingConfig = signingConfigs.release
        signingConfigs.release.storeFile = file(properties.get("chiakiKeystore"))
        signingConfigs.release.storePassword = properties.get("chiakiKeystorePW")
        signingConfigs.release.keyAlias = properties.get("chiakiKeyAlias")
        signingConfigs.release.keyPassword = properties.get("chiakiKeyPW")
    } else {
        println("Signing not configured, falling back to debug keystore for release build")
        buildTypes.release.signingConfig = signingConfigs.debug
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.core.ktx
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.preference.ktx
    implementation libs.material

    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx

    implementation libs.coroutines.android

    implementation libs.room.runtime
    ksp libs.room.compiler
    implementation libs.room.ktx

    implementation libs.moshi
    ksp libs.moshi.kotlin.codegen

    implementation libs.oboe
    implementation project(':ecp')

    testImplementation 'junit:junit:4.13.2'
}
